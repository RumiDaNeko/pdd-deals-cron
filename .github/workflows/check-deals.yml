# Every 10 minutes: crawl new deals from all stores on smzdm, translate titles to
# Vietnamese (Google's public translate endpoint), and post them to the pdd-deals Worker,
# which filters per subscriber and sends one Telegram message per deal. Needs repo secret RUN_TOKEN.
name: check-deals

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Never run two crawls at once: they would deliver the same deals twice.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl and deliver
        env:
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: python crawl.py
